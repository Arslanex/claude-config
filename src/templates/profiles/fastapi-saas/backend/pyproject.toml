[project]
name = "__PKG__"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PKG__"]
