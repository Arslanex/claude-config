[project]
name = "PKG_NAME"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "sqlalchemy[asyncio]", "asyncpg", "alembic", "pydantic-settings"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "import-linter", "httpx", "pytest-asyncio"]

[tool.ruff]
line-length = 120

# ARCH-0006: her modul ve paket docstring ile baslar.
[tool.ruff.lint]
extend-select = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104"]

# tests kendi bolumunde durur; paket adi ne olursa olsun import sirasi ayni kalir.
[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/PKG_NAME"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
