# Uretim: imaj registry'den gelir, secret'lar .env.production dosyasindan (repoya girmez).
services:
  postgres:
    env_file: ["../.env.production"]
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    image: ${API_IMAGE:?API_IMAGE gerekli}
    env_file: ["../.env.production"]
    # Uretim her zaman gercek dis servislerle calisir; sahte adaptor yalniz gelistirme ve test icindir (ARCH-0007).
    environment:
      WORKER_MODE: live
    restart: unless-stopped
  worker:
    image: ${API_IMAGE:?API_IMAGE gerekli}
    env_file: ["../.env.production"]
    environment:
      WORKER_MODE: live
    restart: unless-stopped
