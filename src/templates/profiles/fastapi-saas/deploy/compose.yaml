name: PKG_NAME
# Taban: servis tanimlari. Ortama ozgu deger overlay dosyalarinda (development/test/production).
services:
  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ../backend
    command: ["uvicorn", "PKG_NAME.interface.http.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DEPLOYMENT_TENANCY: shared_rls
      DEPLOYMENT_TOPOLOGY: saas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ../backend
    # VARSAYIM: worker giris noktasi ilk kod yazilinca dogrulanacak
    command: ["python", "-m", "PKG_NAME.worker"]
    environment:
      DEPLOYMENT_TENANCY: shared_rls
      DEPLOYMENT_TOPOLOGY: saas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
